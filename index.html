<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soil MB Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f8f4;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    h1 {
      color: #176b3a;
      margin-bottom: 10px;
    }

    h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .success {
      font-size: 60px;
      color: #16a34a;
      margin: 15px 0;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    .status {
      margin-top: 22px;
      padding: 14px;
      background: #eaf8ef;
      border-radius: 10px;
      color: #176b3a;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Soil MB Calculator</h1>

    <h2>Secure Account Verification</h2>

    <div class="success">✓</div>

    <p>
      Your email verification request has been processed.
    </p>

    <p>
      You can now return to the Soil MB Calculator
      and continue securely.
    </p>

    <div class="status">
      Secure Verification Page
    </div>

  </div>

</body>
</html>
