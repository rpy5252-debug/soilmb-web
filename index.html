<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soil MB Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f8f4;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    h1 {
      color: #176b3a;
      margin-bottom: 10px;
    }

    h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .success {
      font-size: 60px;
      color: #16a34a;
      margin: 15px 0;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    .status {
      margin-top: 22px;
      padding: 14px;
      background: #eaf8ef;
      border-radius: 10px;
      color: #176b3a;
      font-weight: bold;
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div id="otpLogin" style="max-width:420px;margin:30px auto;padding:20px;border:1px solid #ddd;border-radius:12px;">
  <h2>Soil MB Calculator Login</h2>

  <input id="email" type="email" placeholder="Enter your email"
    style="width:100%;padding:12px;margin:8px 0;">

  <button onclick="sendOTP()"
    style="width:100%;padding:12px;margin:8px 0;">
    Send OTP
  </button>

  <input id="otp" type="text" inputmode="numeric" maxlength="8"
    placeholder="Enter 6-digit OTP"
    style="width:100%;padding:12px;margin:8px 0;">

  <button onclick="verifyOTP()"
    style="width:100%;padding:12px;margin:8px 0;">
    Verify OTP
  </button>

  <button onclick="startPlanPayment('1M')"
  style="width:100%;padding:12px;margin:6px 0;">
  Buy 1 Month - ₹699
</button>

<button onclick="startPlanPayment('3M')"
  style="width:100%;padding:12px;margin:6px 0;">
  Buy 3 Months - ₹1,999
</button>

<button onclick="startPlanPayment('6M')"
  style="width:100%;padding:12px;margin:6px 0;">
  Buy 6 Months - ₹3,999
</button>

<button onclick="startPlanPayment('12M')"
  style="width:100%;padding:12px;margin:6px 0;">
  Buy 12 Months - ₹7,999
</button>
    <p id="otpMessage"></p>
</div>

  <div class="card">

    <h1>Soil MB Calculator</h1>

    <h2>Secure Account Verification</h2>

    <div class="success">✓</div>

    <p>
      Your email verification request has been processed.
    </p>

    <p>
      You can now return to the Soil MB Calculator
      and continue securely.
    </p>

    <div class="status">
      Secure Verification Page
    </div>

  </div>

<script>

const SUPABASE_URL = "https://irkbuqavzfajrpuolzid.supabase.co";
const SUPABASE_KEY = "sb_publishable_dnYAoZd4RFDbWnntZbryAw_IbZOZwIk";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function sendOTP() {
  const email = document.getElementById("email").value.trim();
  const msg = document.getElementById("otpMessage");

  if (!email) {
    msg.textContent = "Please enter your email.";
    return;
  }

  msg.textContent = "Sending OTP...";

  try {
    const { error } = await sb.auth.signInWithOtp({
      email: email
    });

    if (error) {
      msg.textContent = "OTP Error: " + error.message;
      return;
    }

    msg.textContent = "OTP sent. Please check your email.";
  } catch (error) {
    msg.textContent = "OTP Error: " + error.message;
  }
}

async function verifyOTP() {
  const email = document.getElementById("email").value.trim();
  const token = document.getElementById("otp").value.trim();
  const msg = document.getElementById("otpMessage");

  if (!email || token.length !== 8) {
    msg.textContent = "Enter email and 8-digit OTP.";
    return;
  }

  msg.textContent = "Verifying...";

  try {
    const { data, error } = await sb.auth.verifyOtp({
      email: email,
      token: token,
      type: "email"
    });

    if (error) {
      msg.textContent = "Verification failed: " + error.message;
      return;
    }

    const accessToken = data.session?.access_token;

    if (!accessToken) {
      msg.textContent = "Login successful, but session token not found.";
      return;
    }

    sessionStorage.setItem("soilmb_access_token", accessToken);

    const license = await checkLicense();

    if (license.active) {
      msg.textContent =
        `✅ Login successful | Plan: ${license.planCode} | Valid till: ${new Date(license.expiresAt).toLocaleDateString()}`;
    } else {
      msg.textContent =
        "✅ Login successful | कोई Active Subscription नहीं है";
    }

  } catch (error) {
    msg.textContent = "Verification error: " + error.message;
  }
}

async function checkLicense() {
  const token = sessionStorage.getItem("soilmb_access_token");

  if (!token) {
    return {
      active: false,
      error: "LOGIN_REQUIRED"
    };
  }

  try {
    const response = await fetch(
      "https://soilmb-backend.onrender.com/api/license/status",
      {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    const result = await response.json();

    if (!response.ok) {
      return {
        active: false,
        error: result.error || "LICENSE_CHECK_FAILED"
      };
    }

    return result;

  } catch (error) {
    return {
      active: false,
      error: "BACKEND_CONNECTION_FAILED"
    };
  }
}
async function createPaymentOrder(planCode) {
  const token = sessionStorage.getItem("soilmb_access_token");
  const msg = document.getElementById("otpMessage");

  if (!token) {
    msg.textContent = "पहले OTP से Login करें।";
    return null;
  }

  try {
    msg.textContent = "Creating secure payment order...";

    const response = await fetch(
      "https://soilmb-backend.onrender.com/api/payment/create-order",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({
          planCode: planCode
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      msg.textContent =
        "Payment order error: " + (result.error || response.status);
      return null;
    }

    msg.textContent = "✅ Secure payment order created";
    return result;

  } catch (error) {
    msg.textContent = "Payment connection error: " + error.message;
    return null;
  }
}
async function startPlanPayment(planCode) {
  const msg = document.getElementById("otpMessage");

  const order = await createPaymentOrder(planCode);

  if (!order) {
    return;
  }

  const planNames = {
    "1M": "1 Month Subscription",
    "3M": "3 Months Subscription",
    "6M": "6 Months Subscription",
    "12M": "12 Months Subscription"
  };

  const options = {
    key: order.keyId,
    amount: order.amount,
    currency: order.currency,
    order_id: order.orderId,
    name: "Soil MB Calculator",
    description: planNames[planCode] || "Subscription",

    handler: async function (response) {
      msg.textContent = "Payment successful. Verifying...";
      await verifyPayment(response);
    }
  };

  const rzp = new Razorpay(options);

  rzp.on("payment.failed", function () {
    msg.textContent = "Payment failed. Please try again.";
  });

  rzp.open();
}
async function verifyPayment(paymentResponse) {
  const token = sessionStorage.getItem("soilmb_access_token");
  const msg = document.getElementById("otpMessage");

  if (!token) {
    msg.textContent = "Login session नहीं मिला। दोबारा Login करें।";
    return;
  }

  try {
    const response = await fetch(
      "https://soilmb-backend.onrender.com/api/payment/verify",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({
          razorpay_order_id: paymentResponse.razorpay_order_id,
          razorpay_payment_id: paymentResponse.razorpay_payment_id,
          razorpay_signature: paymentResponse.razorpay_signature
        })
      }
    );

    const result = await response.json();

    if (!response.ok || !result.verified) {
      msg.textContent = "Payment verification failed.";
      return;
    }

    msg.textContent = "✅ Payment verified. Subscription activate हो रही है...";

    setTimeout(async () => {
      const license = await checkLicense();

      if (license.active) {
        msg.textContent =
          `✅ Subscription Active | Plan: ${license.planCode} | Valid till: ${new Date(license.expiresAt).toLocaleDateString()}`;
      } else {
        msg.textContent =
          "✅ Payment verified. Subscription activation process में है।";
      }
    }, 3000);

  } catch (error) {
    msg.textContent = "Verification error: " + error.message;
  }
}
</script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>
</html>
