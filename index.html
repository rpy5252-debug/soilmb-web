<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soil MB Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f8f4;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    h1 {
      color: #176b3a;
      margin-bottom: 10px;
    }

    h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .success {
      font-size: 60px;
      color: #16a34a;
      margin: 15px 0;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    .status {
      margin-top: 22px;
      padding: 14px;
      background: #eaf8ef;
      border-radius: 10px;
      color: #176b3a;
      font-weight: bold;
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div id="otpLogin" style="max-width:420px;margin:30px auto;padding:20px;border:1px solid #ddd;border-radius:12px;">
  <h2>Soil MB Calculator Login</h2>

  <input id="email" type="email" placeholder="Enter your email"
    style="width:100%;padding:12px;margin:8px 0;">

  <button onclick="sendOTP()"
    style="width:100%;padding:12px;margin:8px 0;">
    Send OTP
  </button>

  <input id="otp" type="text" inputmode="numeric" maxlength="6"
    placeholder="Enter 6-digit OTP"
    style="width:100%;padding:12px;margin:8px 0;">

  <button onclick="verifyOTP()"
    style="width:100%;padding:12px;margin:8px 0;">
    Verify OTP
  </button>

  <p id="otpMessage"></p>
</div>

  <div class="card">

    <h1>Soil MB Calculator</h1>

    <h2>Secure Account Verification</h2>

    <div class="success">✓</div>

    <p>
      Your email verification request has been processed.
    </p>

    <p>
      You can now return to the Soil MB Calculator
      and continue securely.
    </p>

    <div class="status">
      Secure Verification Page
    </div>

  </div>

<script>
const SUPABASE_URL = "https://irkbuqavzfajrpuolzid.supabase.co";
const SUPABASE_KEY = "sb_publishable_dnYAoZd4RFDbWnntZbryAw_IbZOZwIk";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function sendOTP() {
  const email = document.getElementById("email").value.trim();
  const msg = document.getElementById("otpMessage");

  if (!email) {
    msg.textContent = "Please enter your email.";
    return;
  }

  msg.textContent = "Sending OTP...";

  const { error } = await sb.auth.signInWithOtp({ email });

  if (error) {
    msg.textContent = "OTP Error: " + error.message;
  } else {
    msg.textContent = "OTP sent. Please check your email.";
  }
}

async function verifyOTP() {
  const email = document.getElementById("email").value.trim();
  const token = document.getElementById("otp").value.trim();
  const msg = document.getElementById("otpMessage");

  if (!email || token.length !== 6) {
    msg.textContent = "Enter email and 6-digit OTP.";
    return;
  }

  msg.textContent = "Verifying...";

  const { data, error } = await sb.auth.verifyOtp({
    email: email,
    token: token,
    type: "email"
  });

  if (error) {
    msg.textContent = "Verification failed: " + error.message;
  } else {
    msg.textContent = "✅ Login successful";
    console.log("Authenticated user:", data.user?.id);
  }
}
</script>
</body>
</html>
